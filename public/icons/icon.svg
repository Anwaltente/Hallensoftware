<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a24"/>
      <stop offset="1" stop-color="#070a0f"/>
    </linearGradient>
    <pattern id="hz" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="44" height="44" fill="#facc15"/>
      <rect width="20" height="44" fill="#111111"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g opacity="0.07" stroke="#ffffff" stroke-width="2">
    <path d="M0 128H512M0 256H512M0 384H512M128 0V512M256 0V512M384 0V512"/>
  </g>
  <g transform="translate(256 268)">
    <!-- Hallendach + Wände -->
    <path d="M-150 120 V-28 L0 -122 L150 -28 V120" fill="none" stroke="#22d3ee" stroke-width="30" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
    <!-- Rolltor mit Warnstreifen -->
    <rect x="-86" y="-6" width="172" height="126" rx="6" fill="url(#hz)"/>
    <rect x="-86" y="-6" width="172" height="126" rx="6" fill="none" stroke="#0a0d12" stroke-width="6"/>
    <path d="M-86 30 H86 M-86 64 H86" stroke="#0a0d12" stroke-width="5" opacity="0.55"/>
  </g>
</svg>
